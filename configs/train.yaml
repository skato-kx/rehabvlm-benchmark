# Training configuration scaffold for Qwen-VL fine-tuning
model:
  base_model: "qwen-vl"
  peft: false
  output_dir: "outputs/checkpoints"

data:
  annotations_file: "data/annotations/train.jsonl"
  raw_video_dir: "data/raw"
  cache_dir: "data/processed"

training:
  epochs: 3
  batch_size: 4
  learning_rate: 2e-5
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 100
  evaluation_strategy: "steps"
